<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose in Historical Paris - 16-bit Retro</title>
    <style>
        body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Courier New', monospace; overflow:hidden; }
        canvas { image-rendering:pixelated; border:6px solid #fff; box-shadow:0 0 40px rgba(255,215,0,0.7); }
        .overlay { position:absolute; top:15px; left:15px; color:#FFD700; text-shadow:2px 2px 4px #000; pointer-events:none; }
    </style>
</head>
<body>
    <canvas id="game" width="640" height="360"></canvas>
    
    <div class="overlay">
        <h2>Rose in Historical Paris 🏛️🌹</h2>
        <p>← → / A D : Move  SPACE : Jump + Time Travel</p>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const WIDTH = 640, HEIGHT = 360;

        let currentScene = 0;
        const scenes = [
            "Champs-Élysées 1889",
            "Métro Opening 1900",
            "Montmartre Café 1890s",
            "Louvre Revolution 1793",
            "Eiffel Tower 1889"
        ];

        let player = { x:100, y:220, width:22, height:32, velX:0, velY:0, speed:5, jump:-15, onGround:false };

        let keys = {};
        let platforms = [];

        function loadScene(scene) {
            platforms = [];
            player.x = 80; player.y = 220;

            platforms.push({x:0, y:300, w:WIDTH, h:60, color:'#8B5A2B'});

            if (scene === 0) platforms.push({x:380, y:230, w:140, h:25, color:'#A0522D'});
            if (scene === 1) platforms.push({x:100, y:235, w:420, h:22, color:'#777'});
        }

        loadScene(currentScene);

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (player.onGround) player.velY = player.jump;
                currentScene = (currentScene + 1) % scenes.length;
                loadScene(currentScene);
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            player.velX = 0;
            if (keys['arrowleft'] || keys['a']) player.velX = -player.speed;
            if (keys['arrowright'] || keys['d']) player.velX = player.speed;

            player.velY += 0.8;
            player.x += player.velX;
            player.y += player.velY;

            player.onGround = false;
            for (let p of platforms) {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y < p.y + p.h && player.y + player.height > p.y) {
                    if (player.velY > 0) {
                        player.y = p.y - player.height;
                        player.velY = 0;
                        player.onGround = true;
                    }
                }
            }

            if (player.x < 0) player.x = 0;
            if (player.x > WIDTH - player.width) player.x = WIDTH - player.width;
        }

        function drawBackground() {
            if (currentScene === 0) { // 1889
                ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,WIDTH,HEIGHT);
                ctx.fillStyle = '#555'; ctx.fillRect(0,280,WIDTH,80);
            } else if (currentScene === 1) { // 1900 Metro
                ctx.fillStyle = '#2A2A4A'; ctx.fillRect(0,0,WIDTH,HEIGHT);
                ctx.fillStyle = '#666'; ctx.fillRect(0,260,WIDTH,100);
            } else if (currentScene === 2) { // Montmartre
                ctx.fillStyle = '#F4E8C1'; ctx.fillRect(0,0,WIDTH,HEIGHT);
                ctx.fillStyle = '#8B4513'; ctx.fillRect(0,280,WIDTH,80);
            } else if (currentScene === 3) { // Revolution
                ctx.fillStyle = '#B22222'; ctx.fillRect(0,0,WIDTH,HEIGHT); // Red tone
                ctx.fillStyle = '#EEE'; ctx.fillRect(0,250,WIDTH,110);
            } else if (currentScene === 4) { // Eiffel 1889
                ctx.fillStyle = '#1A0033'; ctx.fillRect(0,0,WIDTH,HEIGHT);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(300,120,25,200);
                ctx.beginPath(); ctx.moveTo(280,300); ctx.lineTo(320,80); ctx.lineTo(355,300); ctx.fill();
            }
        }

        function draw() {
            drawBackground();

            for (let p of platforms) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            // Rose in historical dress
            ctx.fillStyle = '#FF69B4';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#8B008B';
            ctx.fillRect(player.x + 4, player.y + 10, 14, 20);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(scenes[currentScene], WIDTH/2, 45);

            ctx.font = '16px Courier New';
            ctx.fillText("SPACE = Time Travel to Next Era", WIDTH/2, HEIGHT - 20);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
